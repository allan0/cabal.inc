name: cabal
description: A Flutter project for quest-based user engagement in cabals.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # --- TON Blockchain (Critical for TON Native Focus) ---
  ton: ^0.0.7
  
  # --- Backend & Auth ---
  supabase_flutter: ^2.5.8 
  firebase_core: ^2.32.0 

  # --- Core UI & State ---
  provider: ^6.1.5
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  page_transition: ^2.2.1
  collection: ^1.19.1
  uuid: ^4.5.1
  logging: ^1.3.0

  # --- Icons & Styling ---
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.68.0
  marquee: ^2.3.0
  shimmer: ^3.0.0

  # --- Networking & Web3 ---
  http: ^1.2.1
  dio: ^5.5.0
  xml: ^6.5.0
  web3dart: ^2.7.3 
  reown_appkit: ^1.2.0 
  url_launcher: ^6.3.2
  webview_flutter: ^4.9.0

  # --- Utilities ---
  flutter_dotenv: ^5.2.1
  image_picker: ^1.2.0
  video_player: ^2.9.1
  share_plus: ^7.2.2
  path_provider: ^2.1.3
  bs58: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
    - assets/fonts/
    - assets/audio/
    - .env
    - config.env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf

# Fixed: Removed leading space to ensure it's a top-level key
dependency_overrides:
  intl: ^0.20.2
